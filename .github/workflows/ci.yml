name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${matrix.node}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Verify package contents
        run: npm pack --dry-run
